# Portable defaults. setup.sh writes the installation-specific paths into a
# missing config/taskqueue.conf and preserves that file on later updates.
STATE_DIR=""                    # 队列持久状态目录；安装时自动写入
LOGS_DIR=""                     # 任务与 daemon 日志目录；安装时自动写入
MAX_CONCURRENT=10                # 同时运行的最大任务数
SCHEDULER_MODE="backfill"        # 调度策略：backfill 或卡池感知预约 pool_aware_reservation
POOL_AWARE_RESERVATION_MIN_DEVICES=2 # pool_aware_reservation 从几卡任务开始预约；最小为 2
MAX_CONCURRENT_8_CARD_TASKS=0     # 8 卡任务并发上限；0 表示不启用专项限制
MAX_TIME_HARD_CAP=0              # 单任务服务端最长秒数；0 表示不设硬上限
KILL_GRACE=5                     # SIGTERM 后等待多久再发送 SIGKILL（秒）
PTOAS_BASE="/usr/local/ptoas"    # 本机 PTOAS 各版本的管理员配置根目录

# Task execution identity: HwHiAiUser runs as the submitting user with the
# HwHiAiUser NPU group; root runs every queued task as root.
TASK_EXECUTION_MODE="HwHiAiUser" # 任务权限：HwHiAiUser（提交用户）或 root

# Repository selection lives in config/repo-auto-update.env. These settings
# control how long an approved update waits for an idle queue before deferring.
AUTO_UPDATE_IDLE_WAIT_SECONDS=7200 # 等待队列空闲的最长秒数（2 小时）
AUTO_UPDATE_IDLE_WAIT_MAX_SECONDS=7200 # 等待硬上限；同时限制旧配置（2 小时）
AUTO_UPDATE_IDLE_RETRY_SECONDS=300 # 队列忙时重新检查的间隔秒数
USAGE_SAMPLING_ENABLED=false     # 是否采样真实 NPU 利用率；默认关闭
USAGE_SAMPLE_TIMEOUT=5           # 每次 npu-smi 采样的超时秒数

# Comma-separated physical card ids. Empty enables runtime detection.
AVAILABLE_DEVICES=""            # auto 分配可用物理卡号；空值表示自动探测

# HCCS plane topology: semicolon-separated groups of comma-separated card ids,
# e.g. "0,1;2,3". Cards in one group share a communication domain. Empty keeps
# the historical ungrouped behaviour. A repository opts in per task with
# DEVICE_GROUP_AFFINITY=1 in its task-submit.conf.
DEVICE_GROUPS=""                # 同 HCCS plane 的卡组；空值表示不分组
