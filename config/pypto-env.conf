# Shared pypto component paths. This host-local file is created once by
# setup.sh and preserved by later installs and automatic updates.
# Existing exported values take precedence when pypto-setup runs.

PTOAS_ROOT="${PTOAS_ROOT:-/usr/local/bin/ptoas-bin}"
ASCEND_HOME_PATH="${ASCEND_HOME_PATH:-/usr/local/Ascend/cann}"

# Optional shared components. Set GCC15_ROOT only on hosts that provide it.
GCC15_ROOT="${GCC15_ROOT:-}"
CLANG_FORMAT="${CLANG_FORMAT:-/usr/local/bin/clang-format}"
MODELS_ROOT="${MODELS_ROOT:-/data/models}"

# Source repositories such as pto-isa and simpler normally live in each
# user's home directory and therefore do not belong in this host config.
